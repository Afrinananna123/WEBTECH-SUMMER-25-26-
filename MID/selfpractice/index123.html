<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index123 Style.css">
</head>
<body>
    <form>
    <h1 style="text-align: center;">Curriculum Vitae</h1>
      <div class="container" >
          <fieldset>
            <legend style="color: blueviolet">Personal Information :</legend>
              <table>
                <tr>
                   <td><lable for="Name">Name:</lable>
                        <input type="text" id = name name =name>
                    </td>
                </tr>
                <tr>
                    <td><lable for="Name">Father Name:</lable>
                        <input type="text" id = name name =name>
                    </td>
                </tr>
        
                <tr>
                  <td><lable for="Mother">Mother Name:</lable>
                      <input type="text" id = name name =name>
                  </td>
                </tr>
        
                <tr>
                  <td><lable for="DOB">Date of Birth :</lable>
                      <input type="date" id = date date = date >
                  </td>
                </tr>
                <tr>
                  <td><lable for="Addrress"> Permanent Address :</lable>
                      <textarea id = address col="5" rows="5" >
                      </textarea>
                  </td>
                </tr>
                <tr>
                  <td><lable for="Addrress">Present Address :</lable>
                      <textarea id = address col="5" rows="5" >
                      </textarea>
                  </td>
                </tr>
                <tr>
                  <td><label for="Gender"> Gender :</label>
                      <input type="radio" id = Gender name = Male value="Male">Male
                      <input type="radio" id = Gender name = Female value="Female">Female
                  </td>
                </tr>
                <tr>
                  <td><label for="Phone">Phone Number :</label>
                       <input type="tel" id = phone name =name placeholder="+880" >
                  </td>
                </tr>
                <tr>
                  <td><label for="email">Email Address :</label>
                      <input type="email" id="email" name="name" placeholder="@gmail.com">
                  </td>
                </tr>
                <tr>
                  <td><label for="nationality"> Nationality :</label>
                      <input type="country" id="nationality" name="name" >
                  </td>
                </tr>
                <tr>
                  <td><label for="religion">Religion :</label>
                     <input type="text" id="religion" name="name" >
                  </td>
                </tr>
                </table>
         </fieldset>
         <div class="button">
             <table>
              <tr>
              <td colspan="2" align="center">
            <input type="submit" value="SUBMIT"/>
            <input type="reset" value="CLEAR" />
            </td>
          </tr>
        </table>
            
         </div>
       </div>
     </form>
    </body>
</html>
